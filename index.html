<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ライトでもじあてゲーム</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ===================================================
         1. トップページ（ホームページ）
         =================================================== -->
    <div id="page-top" class="page active">
        <div class="container text-center">
            <h1>ライトでもじあてゲーム</h1>
            <p class="description">ライトをうごかして、なんのもじがかくれているかみつけだそう。</p>
            <button id="btn-start" class="btn btn-primary btn-large">ゲームをはじめる</button>
        </div>
    </div>

    <!-- ===================================================
         2. 出題設定画面
         =================================================== -->
    <div id="page-setup" class="page">
        <div class="container">
            <h2>どの文字を出題する？</h2>
            
            <!-- モード切り替えタブ -->
            <div class="tab-group">
                <button id="tab-hiragana" class="tab-btn active">ひらがな</button>
                <button id="tab-katakana" class="tab-btn">カタカナ</button>
                <button id="tab-kanji" class="tab-btn">かんじ（漢字）</button>
            </div>

            <!-- ひらがな・カタカナ用の50音ボード -->
            <div id="board-container">
                <div id="syuon-board" class="grid-board"></div>
                <div class="action-row">
                    <button id="btn-random" class="btn btn-secondary">ランダムにえらぶ</button>
                </div>
            </div>

            <!-- 漢字入力フォーム（初期状態は非表示） -->
            <div id="kanji-container" class="hidden">
                <p>だしたい かんじを 1もじ だけ いれてね：</p>
                <input type="text" id="kanji-input" maxlength="2" placeholder="例：犬">
                <p id="error-message" class="error-text hidden">※文字は 1文字だけ 入力してください！</p>
            </div>

            <!-- 選択状態の表示と決定ボタン -->
            <div class="setup-footer">
                <div class="selected-display">
                    えらんだ文字：<span id="current-selected-text">（まだえらばれていません）</span>
                </div>
                <div class="navigation-buttons">
                    <button id="btn-back-to-top" class="btn btn-text">← トップへもどる</button>
                    <button id="btn-play" class="btn btn-success btn-large" disabled>問題をだす！</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ===================================================
         3. ゲーム本番画面（コントロールパネル集約・全画面フィット版）
         =================================================== -->
    <div id="page-game" class="page">
        <!-- メインの暗闇・ゲームエリア -->
        <div id="game-area">
            <!-- 隠されている大きな文字 -->
            <div id="hidden-text">あ</div>
            <!-- 暗闇とライトを表現するオーバーレイ層 -->
            <div id="dark-overlay"></div>
            <!-- 最上層に配置する4分割の枠線マス -->
            <div id="guide-grid"></div>

            <!-- 右側のコントロールパネル（ライトサイズ変更 ＆ 操作ボタンを集約） -->
            <div id="control-panel">
                <h3>ライトの大きさ</h3>
                <button id="btn-size-small" class="btn-size" data-size="80">
                    <span class="icon">・</span>ちいさい
                </button>
                <button id="btn-size-medium" class="btn-size active" data-size="150">
                    <span class="icon">●</span>ふつう
                </button>
                <button id="btn-size-large" class="btn-size" data-size="250">
                    <span class="icon">■</span>おおきい
                </button>

                <!-- 区切り線 -->
                <div class="panel-divider"></div>

                <!-- 下部フッターから引っ越してきたアクションボタン群 -->
                <button id="btn-reveal" class="btn btn-reveal">せいかいをみる！</button>
                <button id="btn-back-to-setup" class="btn btn-secondary hidden">もういちど遊ぶ</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
