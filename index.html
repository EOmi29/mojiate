<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ライトでもじあてゲーム</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="page-top" class="page active">
        <div class="container text-center">
            <h1>ライトでもじあてゲーム</h1>
            <p class="description">ライトをうごかして、なんのもじがかくれているかみつけだそう。</p>
            <button id="btn-start" class="btn btn-primary btn-large">ゲームをはじめる</button>
        </div>
    </div>

    <div id="page-setup" class="page">
        <div class="container">
            <h2>どの文字を出題する？</h2>
            
            <div class="tab-group">
                <button id="tab-hiragana" class="tab-btn active">ひらがな</button>
                <button id="tab-katakana" class="tab-btn">カタカナ</button>
                <button id="tab-kanji" class="tab-btn">かんじ（漢字）</button>
                <button id="tab-alphabet" class="tab-btn">アルファベット</button>
            </div>

            <div id="board-container">
                <div id="syuon-board" class="grid-board"></div>
                <div class="action-row">
                    <button id="btn-random" class="btn btn-secondary">ランダムにえらぶ</button>
                </div>
            </div>

            <div id="kanji-container" class="hidden">
                <p>だしたい かんじを 1もじ だけ いれてね：</p>
                <input type="text" id="kanji-input" maxlength="2" placeholder="例：犬">
                <p id="error-message" class="error-text hidden">※文字は 1文字だけ 入力してください！</p>
            </div>

            <div id="alphabet-container" class="hidden">
                <div class="alphabet-section">
                    <h3>おおもじ</h3>
                    <div id="alphabet-upper-board" class="grid-board alphabet-grid"></div>
                </div>
                <div class="alphabet-section">
                    <h3>こもじ</h3>
                    <div id="alphabet-lower-board" class="grid-board alphabet-grid"></div>
                </div>
                <div class="action-row">
                    <button id="btn-random-alpha" class="btn btn-secondary">ランダムにえらぶ</button>
                </div>
            </div>

            <div class="setup-footer">
                <div class="selected-display">
                    えらんだ文字：<span id="current-selected-text">（まだえらばれていません）</span>
                </div>
                <div class="navigation-buttons">
                    <button id="btn-back-to-top" class="btn btn-text">← トップへもどる</button>
                    <button id="btn-play" class="btn btn-success btn-large" disabled>問題をだす！</button>
                </div>
            </div>
        </div>
    </div>

    <div id="page-game" class="page">
        <div id="game-area">
            <div id="hidden-text">あ</div>

            <!-- アルファベット専用：文字とガイド線を同じSVG座標系(viewBox)で管理することで
                 ベースライン(基準線)が全26文字で必ず一致するようにする -->
            <svg id="alphabet-text-svg" class="alpha-svg hidden" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet">
                <text id="alphabet-hidden-text" x="500" y="511" text-anchor="middle">A</text>
            </svg>

            <div id="dark-overlay"></div>

            <div id="guide-grid">
                <div class="alpha-line line-1"></div>
                <div class="alpha-line line-2"></div>
                <div class="alpha-line line-3"></div>
                <div class="alpha-line line-4"></div>
            </div>

            <svg id="alphabet-guide-svg" class="alpha-svg hidden" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet">
                <line x1="0" y1="140" x2="1000" y2="140" class="a-line thin"></line>
                <line x1="0" y1="315" x2="1000" y2="315" class="a-line dashed"></line>
                <line x1="0" y1="511" x2="1000" y2="511" class="a-line base"></line>
                <line x1="0" y1="651" x2="1000" y2="651" class="a-line thin"></line>
            </svg>

            <div id="control-panel">
                <h3>ライトの大きさ</h3>
                <button id="btn-size-small" class="btn-size" data-size="80">
                    <span class="icon">・</span>ちいさい
                </button>
                <button id="btn-size-medium" class="btn-size active" data-size="150">
                    <span class="icon">●</span>ふつう
                </button>
                <button id="btn-size-large" class="btn-size" data-size="250">
                    <span class="icon">■</span>おおきい
                </button>

                <div class="panel-divider"></div>

                <button id="btn-reveal" class="btn btn-reveal">せいかいをみる！</button>
                <button id="btn-back-to-setup" class="btn btn-secondary hidden">もういちど遊ぶ</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
